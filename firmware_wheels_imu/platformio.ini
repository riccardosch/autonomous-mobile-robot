; PlatformIO project for the ESP32 DevKit (38 pins) that drives the two wheel
; motors through an L298N, reads their single-channel Hall encoders and the
; BMI160 IMU.
;
; Environments (same control task, motors, encoders and IMU code):
;   debug     serial monitor at 115200 baud with the test keys (tests T1-T6)
;   microros  micro-ROS node over the USB serial at 921600 baud (test T7)

[platformio]
default_envs = debug

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
; Uploads at the default 460800 baud fail after the stub starts ("No serial
; data received"); 115200 works.
upload_speed = 115200

[env:debug]
monitor_speed = 115200   ; keep in sync with SERIAL_BAUD in src/config.h
build_src_filter = +<*> -<main_microros.cpp>

[env:microros]
monitor_speed = 921600   ; keep in sync with MICROROS_BAUD in src/config.h
board_microros_distro = jazzy
board_microros_transport = serial
; Pinned to a commit so that a rebuild uses the same micro-ROS.
lib_deps = https://github.com/micro-ROS/micro_ros_platformio#cfee17faffaa532363b7151dd13af6a85c69d3c1
build_src_filter = +<*> -<main_debug.cpp>
