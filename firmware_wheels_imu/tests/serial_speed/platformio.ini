; Serial link speed test for the micro-ROS transport (test T7).
; A separate project, so the wheel firmware is not touched. Flash it, run
; serial_speed.py on the Pi, then flash the wheel firmware again.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
upload_speed = 115200   ; see ../../platformio.ini
monitor_speed = 115200
