; PlatformIO project for the ESP32 DevKit (38 pins) that drives the two wheel
; motors through an L298N and reads their single-channel Hall encoders.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
; Uploads at the default 460800 baud fail after the stub starts ("No serial
; data received"); 115200 works.
upload_speed = 115200
monitor_speed = 115200   ; keep in sync with SERIAL_BAUD in src/config.h
