lidar_bridge:
  ros__parameters:
    port: /dev/ttyACM0
    frame_id: laser
    # YDLIDAR angles grow clockwise seen from above; the node converts them to
    # the ROS convention (counter-clockwise). Still to be checked on the robot.
    clockwise: true
    # Rotation between the LiDAR's 0 degrees and the x axis of the laser frame.
    # Checked on the robot on 2026-11-16: a box placed in front of the robot
    # showed up behind it, so the scan was rotated by 180 degrees. -180 and
    # +180 are the same rotation; -180 keeps the scan inside [-pi, pi).
    angle_offset_deg: -180.0
    range_min: 0.12
    range_max: 8.0
