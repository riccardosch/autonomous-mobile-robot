# Nav2 for the AGV: LiDAR (block 1) + Kinect depth (blocks 2, 3b). Started by launch/nav.launch.py.
# Based on nav2_bringup/params/nav2_params.yaml (Jazzy 1.3); only the servers
# we start are kept. Changed or added values are marked AGV.
#
# Robot: round, radius 0.17 m (body_diameter 0.340 in agv.urdf.xacro).
# Speed limits come from the wheels: 8 rad/s max * 0.035 m = 0.28 m/s; the
# wheel PI is tested from 2 rad/s (0.07 m/s) up, so the minimum speeds stay
# near that. Turn rate w needs w * 0.1175 / 0.035 rad/s on each wheel.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Default trees: replan at 1 Hz, recoveries = clear costmaps, spin, wait, back up.
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3      # AGV: slow robot (was 0.5)
      movement_time_allowance: 15.0      # AGV (was 10.0)
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15            # AGV (was 0.25)
      yaw_goal_tolerance: 0.25

    # AGV: Regulated Pure Pursuit instead of MPPI. It follows the planned path
    # and slows down near obstacles; going around a new obstacle is done by
    # the planner, which replans every second on the global costmap.
    # Much lighter on the Pi's CPU than MPPI.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.20           # m/s, wheels at ~5.7 rad/s (max 8)
      lookahead_dist: 0.3                # AGV 2026-11-21: was 0.4; a closer aim cuts corners less
      min_lookahead_dist: 0.2            # (was 0.25)
      max_lookahead_dist: 0.7
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.8 # rad/s, wheels at ~2.7 rad/s
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.07 # do not crawl below the tested wheel speeds
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0   # AGV (was 1.5): slow near obstacles = short check, it can creep past
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.07   # slowest, in tight places
      cost_scaling_dist: 0.4             # AGV: start slowing down 40 cm from obstacles (was 0.3)
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 4.0 # must equal the costmaps' cost_scaling_factor
      use_rotate_to_heading: true        # turn on the spot first: the robot can, a car cannot
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 20.0            # AGV: was 2.0. RPP ramps from the *measured* turn rate: from standstill it asked 0.1 rad/s, too little to move the wheels (0.34 rad/s each), so it never got going. agv_odometry already ramps the wheels.
      allow_reversing: false
      use_fixed_curvature_lookahead: false
      interpolate_curvature_after_goal: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.025                  # AGV: 2.5 cm cells near the robot, for tight passages
      # AGV: the real size, 2.5 cm cells, LiDAR + Kinect: this costmap decides whether
      # the robot really fits (the controller stops before touching).
      robot_radius: 0.17                 # AGV (was 0.22)
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "depth_layer", "inflation_layer"]
      obstacle_layer:                    # LiDAR: marks what it hits, clears what it sees through
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      # Kinect: obstacles from 5 cm up to the robot's height, up to 1.5 m ahead.
      # Spatio-Temporal Voxel Layer: a mark fades fast when the camera looks at that
      # place and the obstacle is gone (people, pets), and otherwise after voxel_decay
      # seconds: long enough to remember a low obstacle while the robot passes it in
      # the Kinect's blind zone (closer than 0.5 m).
      depth_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 30.0                # s; marks go much sooner when the camera sees the place empty
        decay_model: 0                   # linear
        voxel_size: 0.05
        track_unknown_space: true
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1            # max with the layers below
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: depth_mark depth_clear
        depth_mark:
          data_type: PointCloud2
          topic: /kinect/depth_obstacles/points
          marking: true
          clearing: false
          obstacle_range: 1.6
          min_obstacle_height: 0.0
          max_obstacle_height: 0.40
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: ""
          voxel_min_points: 0
          clear_after_reading: true
        depth_clear:                     # the camera's field of view: marks inside it fade fast
          data_type: PointCloud2
          topic: /kinect/depth_obstacles/floor
          sensor_frame: kinect_depth_optical_frame   # the clouds are in base_footprint
          marking: false
          clearing: true
          min_z: 0.5                     # m, the Kinect v1 sees nothing closer
          max_z: 1.5
          vertical_fov_angle: 0.75       # rad, 43 deg
          horizontal_fov_angle: 0.99     # rad, 57 deg
          decay_acceleration: 5.0
          model_type: 0                  # depth camera
          clear_after_reading: true
      # Robot radius 0.17 m + 1 cm padding: the robot centre cannot get closer to an
      # obstacle than that. Past it the cost falls off up to 0.55 m (cost_scaling_factor
      # 4): the path keeps to the middle when there is room and still takes passages
      # with a few cm per side.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.55
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # AGV: the real radius, as in the local costmap. (An optimistic 0.15 m, tried on
      # 2026-11-21, made the planner brush obstacles that the controller then refused.)
      robot_radius: 0.17
      footprint_padding: 0.01
      resolution: 0.05
      track_unknown_space: true
      # AGV: the SLAM map is the base; live obstacles on top, all of them forgotten
      # when the sensors see the place free again (or after 15 s for the Kinect).
      plugins: ["static_layer", "obstacle_layer", "depth_layer", "inflation_layer"]
      static_layer:                      # the /map from slam_toolbox
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:                    # LiDAR: marks what it hits, clears what it sees through
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      # Kinect: obstacles from 5 cm up to the robot's height, up to 1.5 m ahead.
      # Spatio-Temporal Voxel Layer: a mark fades fast when the camera looks at that
      # place and the obstacle is gone (people, pets), and otherwise after voxel_decay
      # seconds: long enough to remember a low obstacle while the robot passes it in
      # the Kinect's blind zone (closer than 0.5 m).
      depth_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 60.0                # s; marks go much sooner when the camera sees the place empty
        decay_model: 0                   # linear
        voxel_size: 0.05
        track_unknown_space: true
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1            # max with the layers below
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: depth_mark depth_clear
        depth_mark:
          data_type: PointCloud2
          topic: /kinect/depth_obstacles/points
          marking: true
          clearing: false
          obstacle_range: 1.6
          min_obstacle_height: 0.0
          max_obstacle_height: 0.40
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: ""
          voxel_min_points: 0
          clear_after_reading: true
        depth_clear:                     # the camera's field of view: marks inside it fade fast
          data_type: PointCloud2
          topic: /kinect/depth_obstacles/floor
          sensor_frame: kinect_depth_optical_frame   # the clouds are in base_footprint
          marking: false
          clearing: true
          min_z: 0.5                     # m, the Kinect v1 sees nothing closer
          max_z: 1.5
          vertical_fov_angle: 0.75       # rad, 43 deg
          horizontal_fov_angle: 0.99     # rad, 57 deg
          decay_acceleration: 5.0
          model_type: 0                  # depth camera
          clear_after_reading: true
      # Robot radius 0.17 m + 1 cm padding: the robot centre cannot get closer to an
      # obstacle than that. Past it the cost falls off up to 0.55 m (cost_scaling_factor
      # 4): the path keeps to the middle when there is room and still takes passages
      # with a few cm per side.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.55
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    # AGV 2026-11-21: Smac 2D instead of NavFn. NavFn paths brushed chair legs
    # (1-2 cm from the robot outline) and the controller refused them; Smac 2D
    # adds cost_travel_multiplier * cell cost to every step, so the path keeps
    # to the middle of passages and still goes through narrow ones.
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.5                     # m, a goal in an obstacle may be reached this close
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true                # goals in not yet mapped space are allowed
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0             # s
      cost_travel_multiplier: 2.0        # how strongly the path keeps away from obstacles
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]   # AGV: the ones the default trees use
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8              # AGV (was 1.0)
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0              # AGV (was 3.2)

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    node_names: ["controller_server", "planner_server", "behavior_server", "bt_navigator"]
    bond_timeout: 4.0
