# Wheel radius and separation must match raspberry/src/agv_description/urdf/agv.urdf.xacro
# (wheel_diameter / 2 and wheel_separation). Both are approximate until the
# odometry calibration: straight run over a measured distance (radius), turns
# in place (separation).
odometry:
  ros__parameters:
    wheel_radius: 0.035        # m
    wheel_separation: 0.235    # m, between the wheel tread centres
    left_joint: left_wheel_joint
    right_joint: right_wheel_joint
    odom_frame: odom
    base_frame: base_footprint
    publish_tf: true
    max_wheel_step_rad: 1.0    # larger jumps between two messages = ESP32 restart, skipped
    cmd_rate_hz: 20.0          # /wheel_cmd rate while /cmd_vel is alive
    cmd_timeout_s: 0.5         # /cmd_vel older than this: targets ramp to 0
    max_wheel_accel: 20.0      # rad/s^2: 0 to 4 rad/s in 0.2 s
