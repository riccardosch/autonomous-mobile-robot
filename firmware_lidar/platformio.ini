; PlatformIO project for the ESP32-C3 SuperMini that reads the YDS2MD-1 LiDAR
; (YDLIDAR X2/X2L protocol) and forwards scans to the Raspberry Pi over USB.
;
; Environments:
;   esp32c3        binary scan frames (default, read by tools/read_scan.py)
;   esp32c3_debug  human-readable statistics, for `pio device monitor`
;   esp32c3_raw    raw LiDAR bytes forwarded unchanged, to check the wiring

[platformio]
default_envs = esp32c3

[env]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Flashing with the esptool stub fails ("No serial data received") while the
; LiDAR is connected; the ROM loader alone works. See README.md, "Build and flash".
upload_speed = 115200
upload_flags = --no-stub
build_flags =
    ; The SuperMini has no USB-UART bridge: Serial goes through the native USB CDC
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3]
build_flags =
    ${env.build_flags}
    -DLIDAR_OUTPUT_BINARY

[env:esp32c3_debug]
build_flags =
    ${env.build_flags}
    -DLIDAR_OUTPUT_DEBUG

[env:esp32c3_raw]
build_flags =
    ${env.build_flags}
    -DLIDAR_OUTPUT_RAW
